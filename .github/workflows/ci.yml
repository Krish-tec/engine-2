name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Dependencies
        run: |
          cd outputs/sim
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          cd outputs/sim
          pnpm run typecheck

  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Dependencies
        run: |
          cd outputs/sim
          pnpm install --frozen-lockfile
      - name: Lint
        run: |
          cd outputs/sim
          pnpm run lint

  unit-tests:
    name: Physics & UI Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Dependencies
        run: |
          cd outputs/sim
          pnpm install --frozen-lockfile
      - name: Run Vitest with Coverage
        run: |
          cd outputs/sim
          pnpm run test:coverage

  e2e-and-a11y:
    name: Playwright Critical Flows & A11y (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Dependencies
        run: |
          cd outputs/sim
          pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: |
          cd outputs/sim
          npx playwright install --with-deps chromium
      - name: Build Simulator Assets
        run: |
          cd outputs/sim
          pnpm run build
      - name: Run E2E Critical Flows
        run: |
          cd outputs/sim
          pnpm run test:e2e
      - name: Run Accessibility Audit
        run: |
          cd outputs/sim
          pnpm run test:a11y

  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Security Tools
        run: pip install bandit pip-audit
      - name: Run Bandit
        run: bandit -r src/ api/ run.py -ll
      - name: Run Pip-Audit
        run: pip-audit -r requirements.txt

  build:
    name: Production Bundle
    needs: [typecheck, lint, unit-tests, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Dependencies
        run: |
          cd outputs/sim
          pnpm install --frozen-lockfile
      - name: Build
        run: |
          cd outputs/sim
          pnpm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-dist
          path: outputs/sim/dist/
